<header>
    <link rel="stylesheet" href="{{ url_for ('static', filename='header.css') }}">
    {% for _ in range(14) %}
        <div><span class="dot"></span></div>
    {% endfor %}
    <nav>
        <div>
            {% if current_user.estPreparateur %}
            <form action="{{ url_for('home') }}" method="GET">
                <button>Gérer les stocks</button>
            </form>
            <form action="{{ url_for('preparation_reservation') }}" method="GET">
                <button>Liste des réservations</button>
            </form>
            {% else %}
            <form action="{{ url_for('preparation_reservation') }}" method="GET">
                <button>Liste des réservations</button>
                <button>Mes réservations</button>
            </form>
            {% endif %}
        </div>
        <div>
            <p class="nom-app">Chimie'O 😷</p>
        </div>
        <div class="user-menu">
            <button class="user-button">
                <img src="{{ url_for('static', filename='images/user.png') }}" alt="user">
                {{ current_user.prenom }} {{ current_user.nom }}
            </button>
            <div class="dropdown-menu">
                <a href="{{ url_for('settings') }}">⚙️ Paramètres</a>
                <a href="{{ url_for('logout') }}">🚪Déconnexion</a>
            </div>
        </div>
    </nav>
</header>
