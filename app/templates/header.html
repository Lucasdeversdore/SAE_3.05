<link rel=" stylesheet " href="{{ url_for ('static', filename='header.css') }}">
<header>
    <nav>
        <div>
            {% if current_user.estPreparateur %}
            <form action="{{ url_for('home') }}" method="GET">
                <button>Gérer les stocks</button>
            </form>
            {% else %}
            <form action="{{ url_for('home') }}" method="GET">
                <button>Liste des produits</button>
            </form>
            {% endif %}
            <form action="{{ url_for('preparation_reservation') }}" method="GET">
                <button>Liste des réservations</button>
            </form>
        </div>
        <div>
            <form action="{{ url_for('logout') }}" method="GET">
                <button><img src="{{url_for('static', filename='images/logout.png')}}" alt ="logout">Logout</button>
            </form>
            <form action="{{ url_for('settings') }}" method="GET">
                <button><img src="{{url_for('static', filename='images/settings.png')}}" alt ="settings">Paramètres</button>
            </form>
        </div>
    </nav>
</header>
